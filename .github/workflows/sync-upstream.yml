name: Sync Fork with Upstream

on:
  schedule:
    # minute (0-59) hour (0-23) day-of-month (1-31) month (1-12) day-of-week (0-7)
    - cron: "0 8 * * *"
  workflow_dispatch:

# If a run is already in progress, cancel it and start the new one
# Prevents two syncs from running in parallel and conflicting
concurrency:
  group: sync-upstream
  cancel-in-progress: true

permissions:
  # Write code (push, reset, branches)
  contents: write
  # Create pull requests when there are conflicts
  pull-requests: write
  # Disable upstream workflows imported into the fork
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Clone the repo with FULL history (fetch-depth: 0)
      # SYNC_TOKEN is a PAT with push rights on the repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git identity
        run: |
          # Bot identity for commits created by this workflow
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Prevent "Terminal is dumb, but EDITOR unset" errors during rebase --continue
          git config core.editor "true"
          # Replace the origin URL to inject the auth token
          # Without this, git push would fail because the default GITHUB_TOKEN lacks force-push rights
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch upstream
        run: |
          # Add the original repo (upstream) as a remote. || true to ignore if already added
          git remote add upstream https://github.com/anomalyco/opencode.git || true
          # Download the latest upstream commits without modifying our local branches
          git fetch upstream

      - name: Check for new changes
        # id: check lets subsequent steps read this step's outputs
        id: check
        run: |
          # Count the number of commits present in upstream/dev but missing from origin/dev
          # rev-list origin/dev..upstream/dev = "commits in upstream that are not in origin"
          NEW_COMMITS=$(git rev-list --count origin/dev..upstream/dev)
          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "No new commits from upstream, nothing to do"
            # Write has_changes=false to GITHUB_OUTPUT so subsequent steps can read it
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NEW_COMMITS new commit(s) from upstream"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase on upstream
        # id so the "Create PR" step can check if this step failed
        id: rebase
        # Only runs if the previous step detected new upstream commits
        if: steps.check.outputs.has_changes == 'true'
        # continue-on-error: true = if the rebase fails, the workflow continues
        # instead of stopping. The next step will check steps.rebase.outcome == 'failure'
        continue-on-error: true
        run: |
          # Delete the temporary branch if it's left over from a previous crashed run
          git branch -D rebase/upstream 2>/dev/null || true

          # Create a temporary branch from origin/dev to rebase on
          # We do NOT rebase directly on dev to protect it in case of failure
          git checkout -b rebase/upstream origin/dev

          # Attempt the rebase — replay our commits on top of upstream/dev
          if ! git rebase upstream/dev; then
            # Rebase has conflicts — check if they're ONLY in workflow files
            # Workflow conflicts are expected (our runner patches vs upstream changes)
            # and can be auto-resolved by accepting upstream's version (we re-sed after)
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            ONLY_WORKFLOWS=true
            while IFS= read -r file; do
              if [[ "$file" != .github/workflows/* ]]; then
                # Conflict in a non-workflow file — we can't auto-resolve this
                ONLY_WORKFLOWS=false
                break
              fi
            done <<< "$CONFLICTED"

            if [ "$ONLY_WORKFLOWS" = "false" ]; then
              echo "Conflicts in non-workflow files — aborting rebase"
              git rebase --abort
              exit 1
            fi

            # Auto-resolve: accept upstream's version for all conflicted workflow files
            # This is safe because we re-apply our runner patches (sed) after the rebase
            echo "Auto-resolving workflow conflicts by accepting upstream's version"
            echo "$CONFLICTED" | xargs git checkout --theirs
            echo "$CONFLICTED" | xargs git add

            # Loop: continue the rebase, resolving workflow conflicts as they come
            while ! git rebase --continue; do
              CONFLICTED=$(git diff --name-only --diff-filter=U)
              while IFS= read -r file; do
                if [[ "$file" != .github/workflows/* ]]; then
                  echo "Conflicts in non-workflow files — aborting rebase"
                  git rebase --abort
                  exit 1
                fi
              done <<< "$CONFLICTED"
              echo "Auto-resolving workflow conflicts by accepting upstream's version"
              echo "$CONFLICTED" | xargs git checkout --theirs
              echo "$CONFLICTED" | xargs git add
            done
          fi

          # --- Rebase succeeded (possibly after auto-resolving workflow conflicts) ---

          # Replace third-party runners (e.g. namespace-ubuntu-24.04) with GitHub standard runners
          # Upstream uses custom runners we don't have, so we replace them
          sed -i -E 's/(runs-on|host|runner): [a-zA-Z]+-[a-zA-Z0-9_-]*(ubuntu|linux)[a-zA-Z0-9_-]*/\1: ubuntu-24.04/g' .github/workflows/*.yml
          sed -i -E 's/(runs-on|host|runner): [a-zA-Z]+-[a-zA-Z0-9_-]*(windows)[a-zA-Z0-9_-]*/\1: windows-latest/g' .github/workflows/*.yml
          # Stage the files modified by sed
          git add .github/workflows/*.yml
          # Only commit if there are actual changes (--quiet returns 0 if nothing changed)
          git diff --cached --quiet || git commit -m "chore(ci): replace third-party runners with GitHub standard runners"

          # Switch back to the dev branch
          git checkout dev
          # Overwrite dev with the content of rebase/upstream (rebase + runner patches)
          git reset --hard rebase/upstream
          # Force-push dev to origin
          # --force-with-lease=origin/dev verifies that origin/dev hasn't moved since our fetch
          # If another run pushed in the meantime, this fails instead of overwriting its work
          git push origin dev --force-with-lease=origin/dev

          # Cleanup: delete the temporary branch (local + remote)
          git branch -D rebase/upstream 2>/dev/null || true
          git push origin --delete rebase/upstream 2>/dev/null || true

      - name: Create PR on non-workflow conflict
        # Only runs if: there are changes AND the rebase failed (conflict in real code)
        if: steps.check.outputs.has_changes == 'true' && steps.rebase.outcome == 'failure'
        run: |
          # Abort any in-progress rebase
          git rebase --abort 2>/dev/null || true

          # Clean up everything to start fresh
          git checkout dev 2>/dev/null || true
          git branch -D rebase/upstream 2>/dev/null || true
          git push origin --delete rebase/upstream 2>/dev/null || true

          # Create branch from OUR dev (shares history with dev = PR will work)
          git checkout -b rebase/upstream origin/dev

          # Merge upstream — conflicts are expected in non-workflow files
          if ! git merge upstream/dev --no-edit; then
            # Collect conflicted files before staging (build pattern dynamically to avoid self-match)
            MARKER="<""<<""<<""<< HEAD"
            CONFLICTED_FILES=$(grep -rl "$MARKER" . --include="*" | grep -v ".git/" | sort)
            git add -A
            git commit --no-edit -m "sync(opencode): merge upstream/dev (has conflicts to resolve)"
            HAS_CONFLICTS=true
          else
            CONFLICTED_FILES=""
            HAS_CONFLICTS=false
          fi

          # Apply runner patches
          sed -i -E 's/(runs-on|host|runner): [a-zA-Z]+-[a-zA-Z0-9_-]*(ubuntu|linux)[a-zA-Z0-9_-]*/\1: ubuntu-24.04/g' .github/workflows/*.yml
          sed -i -E 's/(runs-on|host|runner): [a-zA-Z]+-[a-zA-Z0-9_-]*(windows)[a-zA-Z0-9_-]*/\1: windows-latest/g' .github/workflows/*.yml
          git add .github/workflows/*.yml
          git diff --cached --quiet || git commit -m "chore(ci): replace third-party runners with GitHub standard runners"

          git push origin rebase/upstream

          # Build PR description
          # This PR is READ-ONLY — it exists only to visualize the diff and conflicted files
          # The actual resolution must be done locally via rebase (see instructions in body)
          INSTRUCTIONS="## How to resolve locally"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n\n'"\`\`\`bash"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"# 1. Setup upstream remote (only needed once)"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"git remote add upstream https://github.com/anomalyco/opencode.git"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n\n'"# 2. Fetch latest upstream and rebase"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"git fetch upstream"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"git checkout dev"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"git pull origin dev"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"git rebase upstream/dev"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n\n'"# 3. Resolve conflicts in the files listed above, then for each file:"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"git add <resolved_file>"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"git rebase --continue"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n\n'"# 4. Push and close this PR"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"git push origin dev --force-with-lease"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"\`\`\`"
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n\n'"> **Do NOT merge this PR.** This PR is only a notification to visualize the diff and conflicted files."
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"> If you merge it, upstream commits will be interleaved with ours and our custom commits will no longer be at the end of the history."
          INSTRUCTIONS="${INSTRUCTIONS}"$'\n'"> Instead, resolve locally via rebase, force-push, then close this PR."

          if [ "$HAS_CONFLICTS" = "true" ]; then
            FILE_LIST=$(echo "$CONFLICTED_FILES" | sed 's|^\./||' | while read -r f; do echo "- [ ] \`$f\`"; done)
            PR_BODY="Automatic rebase failed due to conflicts in non-workflow files."
            PR_BODY="${PR_BODY}"$'\n\n'"## Files with conflict markers"
            PR_BODY="${PR_BODY}"$'\n\n'"${FILE_LIST}"
            PR_BODY="${PR_BODY}"$'\n\n'"${INSTRUCTIONS}"
          else
            PR_BODY="Automatic rebase failed but merge completed cleanly."
            PR_BODY="${PR_BODY}"$'\n\n'"${INSTRUCTIONS}"
          fi

          # --repo is REQUIRED because gh defaults to the parent repo in a fork context
          gh pr create --base dev --head rebase/upstream \
            --repo "${{ github.repository }}" \
            --title "Sync upstream $(date +%Y-%m-%d)" \
            --body "$PR_BODY"
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}

      - name: Disable upstream workflows
        # always() = runs even if previous steps failed
        # We always want to disable upstream workflows imported into the fork
        if: always()
        run: |
          # The repo we're working on (concrete-security/private-opencode)
          REPO="${{ github.repository }}"
          # Whitelist: workflows we want to keep active
          KEEP="private-publish.yml sync-upstream.yml test.yml typecheck.yml nix-eval.yml"
          # List all active workflows in the repo as JSON, extract their paths
          gh workflow list --all -q '.[] | select(.state=="active") | .path' --json state,path --repo "$REPO" | while read -r path; do
            # Extract the filename (e.g. .github/workflows/build.yml -> build.yml)
            name=$(basename "$path")
            # If the workflow is NOT in the whitelist, disable it
            # grep -qw searches for the exact word (-w) in silent mode (-q)
            if ! echo "$KEEP" | grep -qw "$name"; then
              echo "Disabling $name"
              # Disable the workflow so it no longer triggers
              gh workflow disable "$name" --repo "$REPO"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
